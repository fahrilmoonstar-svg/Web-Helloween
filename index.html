<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rillzy Dex — Cyberpunk 2026 Liquid Glass Experience by Fahril Moonstar">
  <title>Rillzy Dex — Cyberpunk 2026</title>

  <style>
    /* ===== RESET ===== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ===== VARIABEL CYBERPUNK 2026 ===== */
    :root {
      --hitam-cyber: #050818;
      --biru-neon: #00F0FF;
      --magenta-neon: #FF00C8;
      --ungu-neon: #7B2FFD;
      --putih-cyber: #E0F7FF;
      --kaca-blur: 12px;
      --kaca-opacity: 0.22;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, var(--hitam-cyber) 0%, #09132F 55%, #0F1A3D 100%);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--putih-cyber);
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Efek garis scan cyber */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(0, 240, 255, 0.04) 2px,
        rgba(0, 240, 255, 0.04) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ===== PARTIKEL ===== */
    .partikel {
      position: fixed;
      width: 3px;
      height: 3px;
      background: var(--biru-neon);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--biru-neon);
      animation: jatuh linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes jatuh {
      0%   { transform: translateY(-10vh); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }

    /* ===== CONTAINER LIQUID GLASS ===== */
    .container {
      text-align: center;
      z-index: 10;
      border: 1px solid rgba(0, 240, 255, 0.45);
      padding: 3.2rem 2.2rem;
      border-radius: 26px;
      background: rgba(255, 255, 255, var(--kaca-opacity));
      box-shadow:
        0 0 40px rgba(0, 240, 255, 0.30),
        inset 0 0 35px rgba(255, 0, 200, 0.10);
      backdrop-filter: blur(var(--kaca-blur));
      -webkit-backdrop-filter: blur(var(--kaca-blur));
      max-width: 660px;
      width: 100%;
    }

    .logo-icon {
      font-size: 5.2rem;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 24px var(--magenta-neon));
      user-select: none;
      animation: glowPulse 2.6s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 18px var(--magenta-neon)); }
      50%      { filter: drop-shadow(0 0 34px var(--magenta-neon)); }
    }

    h1 {
      font-size: clamp(1.5rem, 5.5vw, 2.6rem);
      margin-bottom: 1rem;
      line-height: 1.4;
      text-shadow: 0 0 14px var(--biru-neon);
    }

    .sub-title {
      font-size: clamp(0.95rem, 2.8vw, 1.2rem);
      color: var(--biru-neon);
      margin-bottom: 2.5rem;
      text-shadow: 0 0 8px var(--biru-neon);
    }

    /* ===== TOMBOL ===== */
    .btn-group {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      min-height: 60px;
    }

    .btn {
      padding: 1.1rem 2.6rem;
      border: 1px solid transparent;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      letter-spacing: 1px;
      user-select: none;
    }

    .btn:focus-visible {
      outline: 2px solid var(--putih-cyber);
      outline-offset: 4px;
    }

    .btn-si {
      background: linear-gradient(135deg, var(--biru-neon), var(--ungu-neon));
      color: #050815;
      box-shadow: 0 0 22px var(--biru-neon);
    }

    .btn-si:hover,
    .btn-si:focus-visible {
      transform: scale(1.08);
      box-shadow: 0 0 38px var(--biru-neon);
    }

    .btn-tidak {
      background: linear-gradient(135deg, var(--magenta-neon), #99007A);
      color: white;
      box-shadow: 0 0 20px var(--magenta-neon);
      transition: transform 0.15s ease, box-shadow 0.25s ease;
      will-change: transform;
    }

    /* ===== PESAN ===== */
    .pesan {
      margin-top: 2.5rem;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: var(--biru-neon);
      text-shadow: 0 0 10px var(--biru-neon);
      display: none;
      line-height: 1.5;
    }

    .pesan.tampil {
      display: block;
      animation: muncul 0.5s ease-out;
    }

    @keyframes muncul {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== CREDIT & EMAIL ===== */
    .credit {
      margin-top: 2.2rem;
      font-size: 0.88rem;
      color: var(--magenta-neon);
      text-shadow: 0 0 6px var(--magenta-neon);
      opacity: 0.88;
    }

    .email-text {
      margin-top: 0.6rem;
      font-size: 0.82rem;
      color: var(--putih-cyber);
      opacity: 0.75;
    }

    /* ===== BAYANGAN BAWAH ===== */
    .bayangan {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 140px;
      background: linear-gradient(0deg, rgba(5, 8, 24, 0.94) 0%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* ===== RESPONSIF ===== */
    @media (max-width: 500px) {
      .logo-icon { font-size: 3.5rem; }
      .btn-group { gap: 1rem; }
      .btn { padding: 0.9rem 1.7rem; font-size: 1rem; }
      .container { padding: 2.1rem 1.3rem; border-radius: 22px; }
    }

    /* ===== REDUCE MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo-icon" aria-hidden="true">⚡</div>
    <h1>Rillzy Dex</h1>
    <p class="sub-title">Cyberpunk 2026 • Liquid Glass Smooth Experience</p>

    <div class="btn-group">
      <button class="btn btn-si" id="btnSi" type="button">💠 Masuk Dunia Cyber</button>
      <button class="btn btn-tidak" id="btnTidak" type="button">💜 Nanti Dulu</button>
    </div>

    <div class="pesan" id="pesanBox" role="status" aria-live="polite">
      🎉 Selamat datang di Rillzy Dex! Rasakan pengalaman cyberpunk 2026 dengan tampilan liquid glass yang halus!
    </div>

    <p class="credit">Developed by Fahril Moonstar ✦ Rillzy Dex — Cyberpunk 2026</p>
    <p class="email-text">Kontak: moonstarstore001@gmail.com</p>
  </main>

  <div class="bayangan" aria-hidden="true"></div>

  <script>
    (function () {
      'use strict';

      const btnSi = document.getElementById('btnSi');
      const btnTidak = document.getElementById('btnTidak');
      const pesanBox = document.getElementById('pesanBox');

      // Tombol "Nanti Dulu" kabur
      let posisiX = 0;
      let posisiY = 0;

      function kaburTidak() {
        const batas = 230;
        posisiX = (Math.random() - 0.5) * batas;
        posisiY = (Math.random() - 0.5) * 170;
        btnTidak.style.transform = `translate(${posisiX}px, ${posisiY}px)`;
      }

      btnTidak.addEventListener('mouseenter', kaburTidak);
      btnTidak.addEventListener('touchstart', (e) => {
        e.preventDefault();
        kaburTidak();
      }, { passive: false });

      btnTidak.addEventListener('click', () => {
        pesanBox.textContent = '💜 Baiklah, kapanpun kamu siap, Rillzy Dex selalu menantimu! ⚡';
        pesanBox.classList.add('tampil');
      });

      btnSi.addEventListener('click', () => {
        pesanBox.textContent = '🎉 Selamat datang di Rillzy Dex! Rasakan pengalaman cyberpunk 2026 dengan tampilan liquid glass yang halus!';
        pesanBox.classList.add('tampil');
      });

      // Partikel cyber
      function buatPartikel() {
        const p = document.createElement('div');
        p.classList.add('partikel');
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (Math.random() * 4 + 3).toFixed(2) + 's';
        p.style.opacity = (Math.random() * 0.6 + 0.4).toFixed(2);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 8000);
      }

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduceMotion) {
        setInterval(buatPartikel, 350);
        for (let i = 0; i < 8; i++) {
          setTimeout(buatPartikel, i * 200);
        }
      }
    })();
  </script>
</body>
</html>
